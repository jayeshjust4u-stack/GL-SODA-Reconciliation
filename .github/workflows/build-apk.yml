name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -q GL_SODA_Reconciliation_Android_Project.zip -d android-project

          echo "Extracted files:"
          find android-project -maxdepth 4 -type f | sort

      - name: Find Android project root
        run: |
          echo "Searching for settings.gradle..."
          find android-project -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Enable AndroidX
        run: |
          PROJECT_DIR=$(dirname "$(find android-project -name "settings.gradle" -o -name "settings.gradle.kts" | head -1)")
          
          echo "Android project directory: $PROJECT_DIR"

          cat >> "$PROJECT_DIR/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          echo "gradle.properties:"
          cat "$PROJECT_DIR/gradle.properties"

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find android-project -name "settings.gradle" -o -name "settings.gradle.kts" | head -1)")
          
          echo "Building from: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle assembleDebug --no-daemon \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true

      - name: Find APK
        run: |
          echo "Generated APK:"
          find android-project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GL-SODA-Reconciliation-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
