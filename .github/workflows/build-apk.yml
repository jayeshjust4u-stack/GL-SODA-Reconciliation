name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show project files
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Check AndroidX configuration
        run: |
          echo "gradle.properties:"
          if [ -f gradle.properties ]; then
            cat gradle.properties
          else
            echo "No root gradle.properties found"
          fi

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true

      - name: Find APK
        run: |
          echo "Generated APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GL-SODA-Reconciliation-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
