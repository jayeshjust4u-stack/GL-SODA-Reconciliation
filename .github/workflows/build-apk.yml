name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Xmx5g -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.workers.max=2"
      JAVA_TOOL_OPTIONS: "-Xmx5g"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir android-project

          unzip -q GL_SODA_Reconciliation_Android_Project.zip \
            -d android-project

      - name: Find Android project
        run: |
          SETTINGS=$(find android-project \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project: $PROJECT_DIR"

      - name: Enable AndroidX
        run: |
          touch "$PROJECT_DIR/gradle.properties"

          grep -qxF 'android.useAndroidX=true' \
            "$PROJECT_DIR/gradle.properties" || \
            echo 'android.useAndroidX=true' \
            >> "$PROJECT_DIR/gradle.properties"

          grep -qxF 'android.enableJetifier=true' \
            "$PROJECT_DIR/gradle.properties" || \
            echo 'android.enableJetifier=true' \
            >> "$PROJECT_DIR/gradle.properties"

          echo "Gradle properties:"
          cat "$PROJECT_DIR/gradle.properties"

      - name: Fix PDFBox dependency
        run: |
          find "$PROJECT_DIR" \
            -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -print0 |
          xargs -0 sed -i \
            's/org\.apache\.pdfbox:pdfbox-android/com.tom-roush:pdfbox-android/g'

          echo "PDFBox dependency:"
          grep -RIn \
            "pdfbox-android" \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true

      - name: Find APK
        run: |
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GL-SODA-Reconciliation-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
